<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Painel Administrativo - Irmãos Silva</title>
    <link rel="icon" type="image/jpeg" href="../img/logocar.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">

    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/latest/global/all.js" type="text/javascript"></script>
</head>
<body>

    <!-- ========== TELA DE LOGIN ========== -->
    <main id="loginView" class="login-wrapper" hidden>
        <form id="loginForm" class="login-card" autocomplete="on">
            <h1>AutoPeças Irmãos Silva</h1>
            <p class="subtitle">Painel Administrativo</p>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="username" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required>

            <p id="loginError" class="msg msg-error" hidden></p>

            <button type="submit" id="loginBtn" class="btn btn-primary">Entrar</button>
        </form>
    </main>

    <!-- ========== PAINEL ========== -->
    <div id="panelView" hidden>
        <header class="topbar">
            <div class="topbar-title">Painel de Ofertas</div>
            <button type="button" id="logoutBtn" class="btn btn-outline">Sair</button>
        </header>

        <main class="panel">
            <p class="intro">Edite as 5 ofertas da semana. As mudanças aparecem no site assim que você clicar em <strong>Salvar</strong>.</p>

            <form id="ofertasForm" novalidate>
                <div id="slots" class="slots"></div>

                <div id="saveMsg" class="msg" hidden></div>

                <div class="actions">
                    <button type="submit" id="saveBtn" class="btn btn-primary">Salvar ofertas</button>
                </div>
            </form>
        </main>
    </div>

    <div id="loading" class="loading">Carregando...</div>

    <script type="module" src="admin.js"></script>
</body>
</html>
